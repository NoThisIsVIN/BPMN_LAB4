server:
  port: 8083

spring:
  application:
    name: lab3-hospital-triage

camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080
    auth:
      method: none
    worker:
      defaults:
        max-jobs-active: 8
        stream-enabled: true

scheduling:
  # Mock hospital scheduling API (served by this application, see edu.pbj2.lab3.mock)
  base-url: http://localhost:8083/mock/scheduling

logging:
  level:
    edu.pbj2: INFO
