server:
  port: 8083

spring:
  application:
    name: lab3-hospital-triage

camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080
    auth:
      method: none
    worker:
      defaults:
        max-jobs-active: 8
        stream-enabled: true

logging:
  level:
    edu.pbj2: INFO
